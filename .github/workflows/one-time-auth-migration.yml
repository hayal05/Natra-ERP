name: One-time auth migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite authentication bootstrap
        shell: python
        run: |
          from pathlib import Path
          import re

          db = Path('src-tauri/src/db.rs')
          s = db.read_text()
          s = re.sub(r'^const DEFAULT_ADMIN_PASSWORD_HASH: &str = .*?;\n', '', s, count=1, flags=re.M)
          s = re.sub(r'\n        let now = now_string\(\);\n        tx\.execute\("INSERT OR IGNORE INTO users\(id,username,password_hash,role,employee_id,active,must_change_password,created_at,updated_at\).*?\n        if old_version < DB_SCHEMA_VERSION \{.*?\n        \}\n', '\n', s, count=1, flags=re.S)
          s = re.sub(r'\n    pub fn prepare_bootstrap_login\(&self, username: &str, password: &str\) -> Result<\(\), DbError> \{.*?\n    \}\n\n    fn queue\(', '\n    fn queue(', s, count=1, flags=re.S)
          marker = '    pub fn authenticate_user(\n'
          if 'pub fn has_users(&self)' not in s:
              addition = '''    pub fn has_users(&self) -> Result<bool, DbError> {\n        let c = self.connect()?;\n        let count: i64 = c.query_row("SELECT COUNT(*) FROM users", [], |r| r.get(0))?;\n        Ok(count > 0)\n    }\n\n'''
              s = s.replace(marker, addition + marker, 1)
          db.write_text(s)

          commands = Path('src-tauri/src/commands.rs')
          s = commands.read_text()
          old = '''    db.prepare_bootstrap_login(&username, &password)\n        .map_err(|_| "Invalid username or password".to_string())?;\n'''
          s = s.replace(old, '', 1)
          old = '''    if !verified {\n        let recovery_ok = username == "admin" && must_change_password && password == "Admin@123";\n        if !recovery_ok {\n            let _ = crate::security::record_failure(&db.path(), &username);\n            return Err("Invalid username or password".into());\n        }\n    }\n'''
          new = '''    if !verified {\n        let _ = crate::security::record_failure(&db.path(), &username);\n        return Err("Invalid username or password".into());\n    }\n'''
          s = s.replace(old, new, 1)
          marker = '#[tauri::command]\npub fn login('
          if 'pub fn first_launch' not in s:
              addition = '''#[tauri::command]\npub fn first_launch(db: State<'_, Database>) -> Result<LoginResponse, String> {\n    clear_session()?;\n    if db.has_users().map_err(|e| e.to_string())? {\n        return Err("Initial setup has already been completed. Please sign in.".into());\n    }\n    let id = "first-launch".to_string();\n    let username = "HR Admin".to_string();\n    let role = "hr_admin".to_string();\n    set_session(AuthSession {\n        id: id.clone(),\n        username: username.clone(),\n        role: role.clone(),\n        employee_id: None,\n    })?;\n    Ok(LoginResponse {\n        id,\n        username,\n        role: "HR Admin".into(),\n        employee_id: None,\n        must_change_password: false,\n    })\n}\n\n'''
              s = s.replace(marker, addition + marker, 1)
          commands.write_text(s)

          lib = Path('src-tauri/src/lib.rs')
          s = lib.read_text()
          if 'commands::first_launch,' not in s:
              s = s.replace('            commands::login,\n', '            commands::first_launch,\n            commands::login,\n', 1)
          lib.write_text(s)

          main = Path('src/main.js')
          s = main.read_text()
          if 'invokeNative(\'first_launch\')' not in s:
              old = "async function render(){if(!state.role){const session=getSession();if(session){state.user=session;state.role=session.role}else{return loginPage()}}"
              new = "async function render(){if(!state.role){const session=getSession();if(session){state.user=session;state.role=session.role}else if(invokeNative){try{const first=await invokeNative('first_launch');setSession(first);state.user=first;state.role=first.role}catch(e){return loginPage()}}else{return loginPage()}}"
              if old not in s:
                  raise SystemExit('main.js render pattern not found')
              s = s.replace(old, new, 1)
          main.write_text(s)

      - name: Validate changes
        run: |
          grep -R "Admin@123\|DEFAULT_ADMIN_PASSWORD_HASH\|prepare_bootstrap_login" -n src-tauri/src src || true
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Commit and remove migration workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/db.rs src-tauri/src/commands.rs src-tauri/src/lib.rs src/main.js .github/workflows/one-time-auth-migration.yml
          git commit -m "fix: remove default login and enable first-launch access"
          git rm .github/workflows/one-time-auth-migration.yml
          git commit -m "chore: remove one-time auth migration workflow"
          git push
