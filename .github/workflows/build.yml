name: Build Natra ERP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Generate Tauri icons
        working-directory: src-tauri
        shell: pwsh
        run: |
          npx --yes @tauri-apps/cli@2.11.4 icon app-icon.svg
          if (!(Test-Path "icons/icon.ico")) {
            Write-Error "Tauri icon generation failed: src-tauri/icons/icon.ico was not created"
            exit 1
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Tauri application
        working-directory: src-tauri
        shell: pwsh
        run: npx --yes @tauri-apps/cli@2.11.4 build

      - name: Verify Windows installers
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if (-not $msi -and -not $exe) {
            Write-Error "Tauri build completed without producing an MSI or NSIS installer"
            exit 1
          }
          if ($msi) { $msi | ForEach-Object { Write-Host "MSI: $($_.FullName)" } }
          if ($exe) { $exe | ForEach-Object { Write-Host "NSIS: $($_.FullName)" } }

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natra-erp-windows-${{ github.run_number }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
