[package]
name = "natra-erp"
version = "0.1.0"
description = "NATRA ERP native Windows layer"
authors = ["NATRA"]
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
argon2 = "0.5"
rand = "0.8"
